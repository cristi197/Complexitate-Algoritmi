name: Astro performance

on:
  pull_request:
    paths: ['astro-legacy/**', '.github/workflows/perf.yml']
  workflow_dispatch:
    inputs:
      enforce:
        description: 'Fail on budget violations'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: astro-legacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro-legacy/package-lock.json
      - run: npm ci
      - name: Build, bundle size, Lighthouse, comparison
        run: npm run perf
        env:
          # Budgets become blocking from PR3 (React + MDX foundation).
          PERF_ENFORCE: ${{ inputs.enforce && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-report
          path: astro-legacy/reports/perf/current
          retention-days: 90
      - name: Comment summary on PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const file = 'astro-legacy/reports/perf/current/summary.md';
            if (!fs.existsSync(file)) return;
            const marker = '<!-- perf-report -->';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n${fs.readFileSync(file, 'utf8')}\n[Rapoarte complete (artifact perf-report)](${run})`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find(c => c.body?.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
