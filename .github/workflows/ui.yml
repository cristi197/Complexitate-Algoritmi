name: Astro UI checks

on:
  pull_request:
    paths: ['astro-legacy/**', '.github/workflows/ui.yml']
  push:
    branches: [main]
    paths: ['astro-legacy/**', '.github/workflows/ui.yml']

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: astro-legacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro-legacy/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - name: Chromium (desktop, mobile, dark)
        run: npx playwright test --project=desktop --project=mobile --project=dark
      - name: Firefox + WebKit (informational until PR1 fixes the WebKit focus bug)
        continue-on-error: true
        run: npx playwright test --project=firefox --project=webkit-mobile --output=test-results/other-browsers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astro-ui-results
          path: |
            astro-legacy/playwright-report
            astro-legacy/test-results
            astro-legacy/tests/ui/__screenshots__
          retention-days: 14
